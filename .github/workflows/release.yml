name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from main (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate requested version and source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run manual releases from main"; exit 1; }
            tag="v${REQUESTED_VERSION#v}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag already exists: $tag"; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a stable SemVer tag such as v0.1.0"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release commits must belong to main"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  installers:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            extension: deb
            task: packageDeb
            devbox: true
          - os: macos-15
            platform: macos-arm64
            extension: dmg
            task: packageDmg
            devbox: true
          - os: windows-2025
            platform: windows-x64
            extension: msi
            task: packageMsi
            devbox: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install latest Devbox and project tools
        if: matrix.devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0 (latest stable CLI)
        # Omit devbox-version: latest stable Devbox CLI is selected automatically.

      - name: Test and package in Devbox
        if: matrix.devbox
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: devbox run -- gradle test ${{ matrix.task }} --no-daemon

      # Devbox/Nix do not work natively on Windows. The 2025 runner already has
      # JDK 21, Gradle and WiX, so no third-party installation step is needed.
      - name: Test and package with preinstalled Windows tools
        if: ${{ !matrix.devbox }}
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:JAVA_HOME_21_X64) { throw "Missing JDK 21 on runner" }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          gradle test packageMsi --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }

      - name: Show packaging diagnostics
        if: failure() && matrix.devbox
        shell: bash
        run: |
          if [ -d build/compose/logs ]; then
            find build/compose/logs -type f -print -exec cat {} \;
          fi

      - name: Stage Unix installer
        if: matrix.devbox
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          location="build/compose/binaries/main/$EXTENSION"
          file=$(find "$location" -type f -name "*.$EXTENSION" -print -quit)
          test -n "$file" && test -s "$file"
          count=$(find "$location" -type f -name "*.$EXTENSION" | wc -l | tr -d ' ')
          test "$count" -eq 1
          mkdir -p release
          cp "$file" "release/WallpaperManager-$TAG-$PLATFORM.$EXTENSION"

      - name: Stage Windows installer
        if: ${{ !matrix.devbox }}
        shell: pwsh
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -Path "build/compose/binaries/main/msi" -Recurse -File -Filter "*.msi")
          if ($files.Count -ne 1) { throw "Expected one MSI, got $($files.Count)" }
          New-Item -Path release -ItemType Directory -Force | Out-Null
          Copy-Item $files[0].FullName "release/WallpaperManager-$env:TAG-$env:PLATFORM.msi"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [validate, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Verify deliverables and checksums
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in "WallpaperManager-$TAG-linux-x64.deb" "WallpaperManager-$TAG-macos-arm64.dmg" "WallpaperManager-$TAG-windows-x64.msi"; do
            test -s "release/$asset" || { echo "::error::Missing $asset"; exit 1; }
          done
          (cd release && sha256sum ./*.deb ./*.dmg ./*.msi > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"; exit 1
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" release/* --target "$TARGET" --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" release/* --target "$TARGET" --title "$TAG" --generate-notes
          fi
