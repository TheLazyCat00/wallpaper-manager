name: Kotlin desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            devbox: true
          - os: macos-15
            devbox: true
          - os: windows-2025
            devbox: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Nix/Devbox don't support native Windows; the Windows runner already
      # includes JDK 21, Gradle, and WiX. No tools are installed separately.
      - name: Install latest Devbox and project tools
        if: matrix.devbox
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Validate GitHub Actions workflows
        if: matrix.os == 'ubuntu-24.04'
        run: devbox run lint-workflows

      - name: Test (Devbox)
        if: matrix.devbox
        run: devbox run test

      - name: Package Linux installer (Devbox)
        if: matrix.os == 'ubuntu-24.04'
        run: devbox run package-deb

      - name: Package macOS installer (Devbox)
        if: matrix.os == 'macos-15'
        run: devbox run package-dmg

      - name: Show packaging diagnostics
        if: failure() && matrix.devbox
        shell: bash
        run: |
          if [ -d build/compose/logs ]; then
            find build/compose/logs -type f -print -exec cat {} \;
          fi

      - name: Test (native Windows tools)
        if: ${{ !matrix.devbox }}
        shell: pwsh
        run: |
          if (-not $env:JAVA_HOME_21_X64) { throw "JDK 21 is missing from the runner" }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          java -version
          gradle --version
          gradle test packageMsi --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Gradle test/packageMsi failed' }
